[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[redirects]]
  from = "/api/yahoo-auth"
  to = "/.netlify/functions/yahoo-auth"
  status = 200

[[redirects]]
  from = "/api/yahoo-callback"
  to = "/.netlify/functions/yahoo-callback"
  status = 200

[[redirects]]
  from = "/api/yahoo-stats"
  to = "/.netlify/functions/yahoo-stats"
  status = 200

[[redirects]]
  from = "/api/fetch-sheet"
  to = "/.netlify/functions/fetch-sheet"
  status = 200

[[redirects]]
  from = "/api/fetch-supabase"
  to = "/.netlify/functions/fetch-supabase"
  status = 200

[[redirects]]
  from = "/api/puzzle-check"
  to = "/.netlify/functions/puzzle-check"
  status = 200

  [[redirects]]
    from = "/api/save-profile"
    to = "/.netlify/functions/save-profile"
    status = 200

[[redirects]]
  from = "/api/sync-to-supabase"
  to = "/.netlify/functions/sync-to-supabase"
  status = 200

[[redirects]]
  from = "/api/commish"
  to = "/.netlify/functions/commish"
  status = 200

[[redirects]]
  from = "/api/dispatch-console"
  to = "/.netlify/functions/dispatch-console"
  status = 200

# Pull Yahoo scores into Supabase every 15 minutes so the Crawler Companion
# (which reads Supabase directly) stays current through the week.
[functions."sync-cron"]
  schedule = "*/15 * * * *"
